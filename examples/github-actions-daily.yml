# HOME on GitHub Actions. Copy to .github/workflows/ in a PRIVATE repo to use it.
# As written it runs the fixture source in dry-run mode, so it needs no secrets.
# For live runs: add the env secrets below, switch --source, and only then consider --apply.
name: ads-guardrail daily tick
on:
  schedule:
    - cron: "15 6 * * *"   # 06:15 UTC
  workflow_dispatch: {}
concurrency:
  group: ads-guardrail-tick   # never two ticks at once
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      # The audit log is the cooldown and rollback memory. Persist it between runs.
      - uses: actions/cache@v4
        with:
          path: .ads-guardrail
          key: ads-guardrail-state-${{ github.run_id }}
          restore-keys: ads-guardrail-state-
      - name: Tick (dry run)
        env:
          ADS_GUARDRAIL_SOURCE: fixture
          # GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          # GOOGLE_ADS_ACCESS_TOKEN: ${{ secrets.GOOGLE_ADS_ACCESS_TOKEN }}
          # GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          # META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          # META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          ADS_GUARDRAIL_KILL: ${{ vars.ADS_GUARDRAIL_KILL }}   # set the repo variable to 1 to stop all writes
        run: ads-guardrail --config config/guardrail.example.toml tick --as-of 2026-11-01 -v
      - run: ads-guardrail audit verify
      - uses: actions/upload-artifact@v4
        with: { name: plans, path: .ads-guardrail/plans }
